name: Regenerate Mesa notice

# Runs when the Mesa notice tool or its pin changes (bump NIR_TAG in
# tools/mesa_notice.sh together with Godot), or by hand. If the notice changed,
# it pushes the new licenses/mesa.txt to the mesa-notice branch to merge.
on:
  push:
    branches: [main]
    paths:
      - tools/mesa_notice.sh
      - tools/mesa_notice.py
      - .github/workflows/mesa-notice.yml
  workflow_dispatch:

jobs:
  mesa-notice:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Mesa's code generator dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-mako

      - name: Regenerate licenses/mesa.txt
        run: tools/mesa_notice.sh

      - name: Push to the mesa-notice branch if it changed
        run: |
          sha256sum licenses/mesa.txt
          if [[ -z "$(git status --porcelain -- licenses/mesa.txt)" ]]; then
            echo "licenses/mesa.txt is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c mesa-notice
          git add licenses/mesa.txt
          git commit -m "Update licenses/mesa.txt" -m "Generated by tools/mesa_notice.sh in run $GITHUB_RUN_ID."
          git push --force origin mesa-notice
          echo "::warning::licenses/mesa.txt changed; merge the mesa-notice branch."

      - uses: actions/upload-artifact@v6
        with:
          name: mesa-notice
          path: licenses/mesa.txt
          retention-days: 7
