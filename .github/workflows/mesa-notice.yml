name: Regenerate Mesa notice

# Runs when the Mesa notice tool or its pin changes (bump NIR_TAG in
# tools/mesa_notice.sh together with Godot), or by hand. Commit the
# licenses/mesa.txt from the artifact if it reports a difference.
on:
  push:
    branches: [main]
    paths:
      - tools/mesa_notice.sh
      - tools/mesa_notice.py
      - .github/workflows/mesa-notice.yml
  workflow_dispatch:

jobs:
  mesa-notice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Mesa's code generator dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-mako

      - name: Regenerate licenses/mesa.txt
        run: tools/mesa_notice.sh

      - name: Show the result
        run: |
          sha256sum licenses/mesa.txt
          if [[ -n "$(git status --porcelain -- licenses/mesa.txt)" ]]; then
            echo "::warning::licenses/mesa.txt is out of date; commit the one from the mesa-notice artifact."
          fi
          # Exact copy for anyone who can read the log but not the artifact.
          gzip -9cn licenses/mesa.txt | base64 -w 0; echo

      - uses: actions/upload-artifact@v6
        with:
          name: mesa-notice
          path: licenses/mesa.txt
          retention-days: 7
